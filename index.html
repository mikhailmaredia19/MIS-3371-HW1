<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cougar Care Medical | Patient Registration</title>
    <link rel="stylesheet" href="homework1.css">
</head>
<body>

    <div id="wrapper">
        <header>
            <img src="logo.jpg" alt="Cougar Care Logo" width="250">
            <h1>Cougar Care Medical</h1>
            <p id="date-display"></p>
        </header>

        <hr>


        <form action="thankyou.html" id="single-line-form">
            <div class="form-section-header">Account Information</div>
            <div><label>Desired User ID:</label><input type="text" name="uid" maxlength="20"></div>
            <div><label>Email:</label><input type="email" name="email" placeholder="name@domain.tld" required></div>
            <div><label>Password:</label><input type="password" name="pwd1"></div>
            <div><label>Re-enter Password:</label><input type="password" name="pwd2"></div>

            <div class="form-section-header">Personal Details</div>
            <div><label>First Name:</label><input type="text" name="fname" maxlength="30" required></div>
            <div><label>Middle Initial:</label><input type="text" name="mi" maxlength="1" size="2"></div>
            <div><label>Last Name:</label><input type="text" name="lname" maxlength="30" required></div>
            <div><label>Date of Birth:</label><input type="text" name="dob" placeholder="MM/DD/YYYY"></div>
            <div><label>Social Security:</label><input type="password" name="ssn" maxlength="11" placeholder="XXX-XX-XXXX"></div>

            <div class="form-section-header">Contact & Address</div>
            <div><label>Address Line 1:</label><input type="text" name="addr1" maxlength="30"></div>
            <div><label>Address Line 2:</label><input type="text" name="addr2" maxlength="30"></div>
            <div><label>City:</label><input type="text" name="city" maxlength="30"></div>
            <div><label>State:</label>
                <select name="state">
                    <option value="">Select State</option>
                    <option value="AL">Alabama</option>
                    <option value="AK">Alaska</option>
                    <option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option>
                    <option value="CA">California</option>
                    <option value="CO">Colorado</option>
                    <option value="CT">Connecticut</option>
                    <option value="DE">Delaware</option>
                    <option value="DC">District Of Columbia</option>
                    <option value="FL">Florida</option>
                    <option value="GA">Georgia</option>
                    <option value="HI">Hawaii</option>
                    <option value="ID">Idaho</option>
                    <option value="IL">Illinois</option>
                    <option value="IN">Indiana</option>
                    <option value="IA">Iowa</option>
                    <option value="KS">Kansas</option>
                    <option value="KY">Kentucky</option>
                    <option value="LA">Louisiana</option>
                    <option value="ME">Maine</option>
                    <option value="MD">Maryland</option>
                    <option value="MA">Massachusetts</option>
                    <option value="MI">Michigan</option>
                    <option value="MN">Minnesota</option>
                    <option value="MS">Mississippi</option>
                    <option value="MO">Missouri</option>
                    <option value="MT">Montana</option>
                    <option value="NE">Nebraska</option>
                    <option value="NV">Nevada</option>
                    <option value="NH">New Hampshire</option>
                    <option value="NJ">New Jersey</option>
                    <option value="NM">New Mexico</option>
                    <option value="NY">New York</option>
                    <option value="NC">North Carolina</option>
                    <option value="ND">North Dakota</option>
                    <option value="OH">Ohio</option>
                    <option value="OK">Oklahoma</option>
                    <option value="OR">Oregon</option>
                    <option value="PA">Pennsylvania</option>
                    <option value="RI">Rhode Island</option>
                    <option value="SC">South Carolina</option>
                    <option value="SD">South Dakota</option>
                    <option value="TN">Tennessee</option>
                    <option value="TX">Texas</option>
                    <option value="UT">Utah</option>
                    <option value="VT">Vermont</option>
                    <option value="VA">Virginia</option>
                    <option value="WA">Washington</option>
                    <option value="WV">West Virginia</option>
                    <option value="WI">Wisconsin</option>
                    <option value="WY">Wyoming</option>
                </select>
            </div>
            <div><label>Zip:</label><input type="text" name="zip" size="5" placeholder="Zip"></div>

            <div class="form-section-header">Medical History</div>
            <div><label>Gender:</label>
                <input type="radio" name="gender" value="M"> Male 
                <input type="radio" name="gender" value="F"> Female 
                <input type="radio" name="gender" value="O"> Other
            </div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 32px;">
                <label>Vaccinated?</label>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <input type="radio" name="vax" value="Y">
                    <span>Y</span>
                </span>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <input type="radio" name="vax" value="N">
                    <span>N</span>
                </span>
            </div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 32px;">
                <label>Insurance?</label>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <input type="radio" name="ins" value="Y">
                    <span>Y</span>
                </span>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <input type="radio" name="ins" value="N">
                    <span>N</span>
                </span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; margin-top: 24px;">
                <label style="font-weight: bold; text-align: center; margin-bottom: 8px;">History:</label>
                <div class="history-options-container">
                    <span style="display: flex; gap: 16px;">
                        <input type="checkbox" name="h1"> Asthma
                        <input type="checkbox" name="h2"> Hypertension
                        <input type="checkbox" name="h3"> Eczema
                    </span>
                    <span style="display: flex; gap: 16px; margin-top: 8px;">
                        <input type="checkbox" name="h4"> Diabetes Type 1
                        <input type="checkbox" name="h5"> Diabetes Type 2
                    </span>
                </div>
            </div>
            <div><label>Current Pain Level:</label>
                1 <input type="range" name="health" min="1" max="10" value="10"> 10
            </div>
            <div><label>Current Symptoms:</label>
                <textarea name="symptoms" rows="3" cols="50"></textarea>
            </div>
            <div style="text-align: center; padding: 20px;">
                <input type="reset" value="CLEAR AND START OVER" class="btn">
                <input type="submit" value="Submit" class="btn">
            </div>
        </form>

        <hr>

        <footer>
            <div class="foot-box">
                <strong>Cougar Care Medical</strong><br>
                4401 Martin Luther King Blvd, Houston, TX 77004
            </div>
            <div class="foot-box">
                <button type="button" class="contact-btn">CONTACT US</button>
            </div>
            <div class="foot-box">
                <a href="#">FACEBOOK</a> |  <a href="#">INSTRAGRAM</a>
            </div>
        </footer>
    </div>

    <script>
        const d = new Date();
        const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        document.getElementById("date-display").innerHTML = 
            "Today is: " + days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
    </script>
</body>
</html>
